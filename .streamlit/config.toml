[server]
# Nâng cấp dung lượng upload tối đa lên 2048MB (2GB) cho video chất lượng cao
maxUploadSize = 2048
maxMessageSize = 2048
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#f97316"
backgroundColor = "#0b0f19"
secondaryBackgroundColor = "#111827"
textColor = "#f8fafc"
font = "sans serif"
